<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grab</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --line: #e3e1dc; --accent: #2f6f5e; --accent-text: #fff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e21; --text: #ececee; --muted: #9a9aa0;
      --line: #2e2e33; --accent: #5fb39b; --accent-text: #0d1a16; --err: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  input[type=url] {
    width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--text); padding: 10px 18px;
    font: inherit; cursor: pointer;
  }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  select {
    flex: 1; min-width: 140px; padding: 10px 12px; font: inherit; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .go {
    width: 100%; margin-top: 16px; padding: 13px; font: inherit; font-weight: 600;
    border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .go:disabled { opacity: .55; cursor: progress; }
  .preview { display: none; gap: 14px; margin-top: 16px; align-items: center; }
  .preview.show { display: flex; }
  .preview img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--line); }
  .preview .t { font-weight: 600; line-height: 1.3; }
  .preview .m { color: var(--muted); font-size: 14px; }
  .status { margin-top: 14px; min-height: 24px; font-size: 15px; color: var(--muted); }
  .status.err { color: var(--err); }
  .note { color: var(--muted); font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Grab</h1>
  <p class="sub">Paste a link. Get an MP4 or MP3.</p>

  <div class="card">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off">

    <div class="preview" id="preview">
      <img id="thumb" alt="">
      <div><div class="t" id="title"></div><div class="m" id="meta"></div></div>
    </div>

    <div class="row">
      <div class="seg" role="group" aria-label="Format">
        <button type="button" data-fmt="mp4" aria-pressed="true">MP4 video</button>
        <button type="button" data-fmt="mp3" aria-pressed="false">MP3 audio</button>
      </div>
      <select id="quality" aria-label="Quality"></select>
    </div>

    <button class="go" id="go">Download</button>
    <div class="status" id="status" role="status"></div>
  </div>

  <p class="note">Only download content you own or have permission to save.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const QUALITIES = {
  mp4: [["best", "Best available"], ["1080", "1080p"], ["720", "720p"], ["480", "480p"], ["360", "360p"]],
  mp3: [["320", "320 kbps"], ["192", "192 kbps"], ["128", "128 kbps"]],
};
let fmt = "mp4";

function setFormat(f) {
  fmt = f;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.fmt === f));
  $("quality").innerHTML = QUALITIES[f].map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  if (f === "mp3") $("quality").value = "192";
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setFormat(b.dataset.fmt));
setFormat("mp4");

function status(msg, isErr = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("err", isErr);
}
const fmtTime = (s) => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "";

let lastLookup = "";
async function lookup() {
  const url = $("url").value.trim();
  if (!url || url === lastLookup) return;
  lastLookup = url;
  $("preview").classList.remove("show");
  status("Looking up…");
  try {
    const r = await fetch("/api/info", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $("thumb").src = d.thumbnail || "";
    $("title").textContent = d.title || "Untitled";
    $("meta").textContent = [d.uploader, fmtTime(d.duration), d.site].filter(Boolean).join(" · ");
    $("preview").classList.add("show");
    status("");
  } catch (e) { status(e.message, true); }
}
$("url").addEventListener("change", lookup);
$("url").addEventListener("paste", () => setTimeout(lookup, 0));

$("go").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return status("Paste a link first.", true);
  $("go").disabled = true;
  status(fmt === "mp3" ? "Downloading and converting to MP3…" : "Downloading video… big files take a while.");
  try {
    const r = await fetch("/api/download", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, format: fmt, quality: $("quality").value }),
    });
    if (!r.ok) throw new Error((await r.json()).error || "Download failed.");
    const cd = r.headers.get("Content-Disposition") || "";
    const name = decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/) || cd.match(/filename="?([^";]+)"?/) || [, `download.${fmt}`])[1]);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    status(`Done — ${name}`);
  } catch (e) { status(e.message, true); }
  finally { $("go").disabled = false; }
};
</script>
</body>
</html>
